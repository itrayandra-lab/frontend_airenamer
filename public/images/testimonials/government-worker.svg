<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" fill="none">
  <rect width="400" height="400" fill="url(#govGradient)" rx="200"/>
  
  <!-- Professional Avatar -->
  <g transform="translate(200, 200)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="60" fill="#FBBF24"/>
    
    <!-- Hair -->
    <path d="M-50 -80 Q0 -100 50 -80 Q40 -90 20 -85 Q0 -95 -20 -85 Q-40 -90 -50 -80" fill="#374151"/>
    
    <!-- Face -->
    <circle cx="-15" cy="-50" r="3" fill="#374151"/>
    <circle cx="15" cy="-50" r="3" fill="#374151"/>
    <path d="M-10 -30 Q0 -25 10 -30" stroke="#374151" stroke-width="2" fill="none"/>
    
    <!-- Body -->
    <rect x="-40" y="20" width="80" height="100" rx="10" fill="#1F2937"/>
    
    <!-- Shirt -->
    <rect x="-35" y="25" width="70" height="90" rx="8" fill="#FFFFFF"/>
    
    <!-- Tie -->
    <rect x="-8" y="25" width="16" height="60" rx="2" fill="#DC2626"/>
    
    <!-- Arms -->
    <rect x="-60" y="30" width="20" height="60" rx="10" fill="#FBBF24"/>
    <rect x="40" y="30" width="20" height="60" rx="10" fill="#FBBF24"/>
    
    <!-- Government Badge -->
    <rect x="25" y="35" width="20" height="15" rx="3" fill="#3B82F6"/>
    <text x="35" y="45" text-anchor="middle" fill="white" font-size="8">ID</text>
  </g>
  
  <!-- Background Elements -->
  <g opacity="0.1">
    <rect x="50" y="50" width="30" height="40" rx="4" fill="#3B82F6"/>
    <rect x="320" y="80" width="30" height="40" rx="4" fill="#3B82F6"/>
    <rect x="80" y="320" width="30" height="40" rx="4" fill="#3B82F6"/>
    <rect x="290" y="300" width="30" height="40" rx="4" fill="#3B82F6"/>
  </g>
  
  <defs>
    <linearGradient id="govGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
  </defs>
</svg>