<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" fill="none">
  <rect width="400" height="400" fill="url(#photoGradient)" rx="200"/>
  
  <!-- Photographer Avatar -->
  <g transform="translate(200, 200)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="60" fill="#F59E0B"/>
    
    <!-- Hair -->
    <path d="M-50 -80 Q0 -100 50 -80 Q30 -95 0 -90 Q-30 -95 -50 -80" fill="#92400E"/>
    
    <!-- Face -->
    <circle cx="-15" cy="-50" r="3" fill="#374151"/>
    <circle cx="15" cy="-50" r="3" fill="#374151"/>
    <path d="M-10 -30 Q0 -25 10 -30" stroke="#374151" stroke-width="2" fill="none"/>
    
    <!-- Body -->
    <rect x="-40" y="20" width="80" height="100" rx="10" fill="#374151"/>
    
    <!-- Camera Strap -->
    <rect x="-5" y="20" width="10" height="80" rx="2" fill="#1F2937"/>
    
    <!-- Camera -->
    <rect x="-25" y="60" width="50" height="30" rx="6" fill="#111827"/>
    <circle cx="0" cy="75" r="12" fill="#374151"/>
    <circle cx="0" cy="75" r="8" fill="#000000"/>
    <rect x="15" y="68" width="8" height="5" rx="1" fill="#EF4444"/>
    
    <!-- Arms -->
    <rect x="-60" y="30" width="20" height="60" rx="10" fill="#F59E0B"/>
    <rect x="40" y="30" width="20" height="60" rx="10" fill="#F59E0B"/>
  </g>
  
  <!-- Photography Elements -->
  <g opacity="0.15">
    <rect x="60" y="60" width="40" height="30" rx="4" fill="#8B5CF6"/>
    <text x="80" y="80" text-anchor="middle" fill="white" font-size="16">📷</text>
    
    <rect x="300" y="100" width="40" height="30" rx="4" fill="#10B981"/>
    <text x="320" y="120" text-anchor="middle" fill="white" font-size="16">🖼️</text>
    
    <rect x="80" y="300" width="40" height="30" rx="4" fill="#F59E0B"/>
    <text x="100" y="320" text-anchor="middle" fill="white" font-size="16">📸</text>
    
    <rect x="280" y="320" width="40" height="30" rx="4" fill="#EF4444"/>
    <text x="300" y="340" text-anchor="middle" fill="white" font-size="16">🎨</text>
  </g>
  
  <defs>
    <linearGradient id="photoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>
</svg>