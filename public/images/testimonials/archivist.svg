<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" fill="none">
  <rect width="400" height="400" fill="url(#archivistGradient)" rx="200"/>
  
  <!-- Archivist Avatar -->
  <g transform="translate(200, 200)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="60" fill="#D97706"/>
    
    <!-- Hair -->
    <path d="M-50 -80 Q0 -100 50 -80 Q40 -90 20 -85 Q0 -95 -20 -85 Q-40 -90 -50 -80" fill="#78350F"/>
    
    <!-- Glasses -->
    <rect x="-25" y="-60" width="20" height="15" rx="7" fill="none" stroke="#374151" stroke-width="2"/>
    <rect x="5" y="-60" width="20" height="15" rx="7" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="-5" y1="-52" x2="5" y2="-52" stroke="#374151" stroke-width="2"/>
    
    <!-- Face -->
    <circle cx="-15" cy="-50" r="2" fill="#374151"/>
    <circle cx="15" cy="-50" r="2" fill="#374151"/>
    <path d="M-8 -30 Q0 -25 8 -30" stroke="#374151" stroke-width="2" fill="none"/>
    
    <!-- Body -->
    <rect x="-40" y="20" width="80" height="100" rx="10" fill="#1F2937"/>
    
    <!-- Shirt -->
    <rect x="-35" y="25" width="70" height="90" rx="8" fill="#FFFFFF"/>
    
    <!-- Vest -->
    <rect x="-30" y="30" width="60" height="80" rx="6" fill="#374151"/>
    
    <!-- Arms -->
    <rect x="-60" y="30" width="20" height="60" rx="10" fill="#D97706"/>
    <rect x="40" y="30" width="20" height="60" rx="10" fill="#D97706"/>
    
    <!-- Book in hand -->
    <rect x="45" y="50" width="12" height="16" rx="2" fill="#7C2D12"/>
    <rect x="47" y="52" width="8" height="12" rx="1" fill="#FED7AA"/>
  </g>
  
  <!-- Archive Elements -->
  <g opacity="0.15">
    <rect x="60" y="60" width="30" height="40" rx="4" fill="#7C2D12"/>
    <text x="75" y="85" text-anchor="middle" fill="white" font-size="16">📚</text>
    
    <rect x="310" y="100" width="30" height="40" rx="4" fill="#374151"/>
    <text x="325" y="125" text-anchor="middle" fill="white" font-size="16">📋</text>
    
    <rect x="80" y="300" width="30" height="40" rx="4" fill="#7C2D12"/>
    <text x="95" y="325" text-anchor="middle" fill="white" font-size="16">🗂️</text>
    
    <rect x="290" y="320" width="30" height="40" rx="4" fill="#374151"/>
    <text x="305" y="345" text-anchor="middle" fill="white" font-size="16">📄</text>
  </g>
  
  <defs>
    <linearGradient id="archivistGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
  </defs>
</svg>