<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" fill="none">
  <rect width="400" height="400" fill="url(#itGradient)" rx="200"/>
  
  <!-- IT Manager Avatar -->
  <g transform="translate(200, 200)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="60" fill="#F59E0B"/>
    
    <!-- Hair -->
    <path d="M-50 -80 Q0 -100 50 -80 Q30 -95 0 -90 Q-30 -95 -50 -80" fill="#1F2937"/>
    
    <!-- Face -->
    <circle cx="-15" cy="-50" r="3" fill="#374151"/>
    <circle cx="15" cy="-50" r="3" fill="#374151"/>
    <path d="M-10 -30 Q0 -25 10 -30" stroke="#374151" stroke-width="2" fill="none"/>
    
    <!-- Body -->
    <rect x="-40" y="20" width="80" height="100" rx="10" fill="#1F2937"/>
    
    <!-- Shirt -->
    <rect x="-35" y="25" width="70" height="90" rx="8" fill="#3B82F6"/>
    
    <!-- Tie -->
    <rect x="-8" y="25" width="16" height="60" rx="2" fill="#1F2937"/>
    
    <!-- Arms -->
    <rect x="-60" y="30" width="20" height="60" rx="10" fill="#F59E0B"/>
    <rect x="40" y="30" width="20" height="60" rx="10" fill="#F59E0B"/>
    
    <!-- Laptop in hand -->
    <rect x="42" y="50" width="16" height="10" rx="2" fill="#374151"/>
    <rect x="43" y="51" width="14" height="7" rx="1" fill="#111827"/>
    <rect x="44" y="52" width="12" height="5" rx="1" fill="#3B82F6"/>
  </g>
  
  <!-- Tech Elements -->
  <g opacity="0.15">
    <rect x="60" y="60" width="30" height="40" rx="4" fill="#3B82F6"/>
    <text x="75" y="85" text-anchor="middle" fill="white" font-size="16">💻</text>
    
    <rect x="310" y="100" width="30" height="40" rx="4" fill="#10B981"/>
    <text x="325" y="125" text-anchor="middle" fill="white" font-size="16">⚙️</text>
    
    <rect x="80" y="300" width="30" height="40" rx="4" fill="#8B5CF6"/>
    <text x="95" y="325" text-anchor="middle" fill="white" font-size="16">🔧</text>
    
    <rect x="290" y="320" width="30" height="40" rx="4" fill="#F59E0B"/>
    <text x="305" y="345" text-anchor="middle" fill="white" font-size="16">📊</text>
  </g>
  
  <defs>
    <linearGradient id="itGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
  </defs>
</svg>