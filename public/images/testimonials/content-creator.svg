<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" fill="none">
  <rect width="400" height="400" fill="url(#creatorGradient)" rx="200"/>
  
  <!-- Content Creator Avatar -->
  <g transform="translate(200, 200)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="60" fill="#EC4899"/>
    
    <!-- Hair -->
    <path d="M-50 -80 Q0 -100 50 -80 Q40 -90 20 -85 Q0 -95 -20 -85 Q-40 -90 -50 -80" fill="#BE185D"/>
    
    <!-- Face -->
    <circle cx="-15" cy="-50" r="3" fill="#374151"/>
    <circle cx="15" cy="-50" r="3" fill="#374151"/>
    <path d="M-10 -30 Q0 -25 10 -30" stroke="#374151" stroke-width="2" fill="none"/>
    
    <!-- Body -->
    <rect x="-40" y="20" width="80" height="100" rx="10" fill="#374151"/>
    
    <!-- Creative Shirt -->
    <rect x="-35" y="25" width="70" height="90" rx="8" fill="#F472B6"/>
    
    <!-- Design Elements on Shirt -->
    <circle cx="-15" cy="50" r="4" fill="#FFFFFF" opacity="0.8"/>
    <rect x="5" y="45" width="8" height="8" rx="2" fill="#FFFFFF" opacity="0.8"/>
    <polygon points="15,65 25,65 20,75" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Arms -->
    <rect x="-60" y="30" width="20" height="60" rx="10" fill="#EC4899"/>
    <rect x="40" y="30" width="20" height="60" rx="10" fill="#EC4899"/>
    
    <!-- Tablet/Drawing pad in hand -->
    <rect x="42" y="45" width="16" height="20" rx="3" fill="#1F2937"/>
    <rect x="43" y="46" width="14" height="16" rx="2" fill="#FFFFFF"/>
    <rect x="44" y="47" width="12" height="14" rx="1" fill="#F472B6"/>
  </g>
  
  <!-- Creative Elements -->
  <g opacity="0.15">
    <rect x="60" y="60" width="30" height="40" rx="4" fill="#F472B6"/>
    <text x="75" y="85" text-anchor="middle" fill="white" font-size="16">🎨</text>
    
    <rect x="310" y="100" width="30" height="40" rx="4" fill="#8B5CF6"/>
    <text x="325" y="125" text-anchor="middle" fill="white" font-size="16">📱</text>
    
    <rect x="80" y="300" width="30" height="40" rx="4" fill="#10B981"/>
    <text x="95" y="325" text-anchor="middle" fill="white" font-size="16">🎬</text>
    
    <rect x="290" y="320" width="30" height="40" rx="4" fill="#F59E0B"/>
    <text x="305" y="345" text-anchor="middle" fill="white" font-size="16">✨</text>
  </g>
  
  <defs>
    <linearGradient id="creatorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
  </defs>
</svg>